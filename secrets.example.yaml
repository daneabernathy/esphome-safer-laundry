# =====================================================================
#  Copy this file to secrets.yaml (same folder) and fill in your values.
#  secrets.yaml is in .gitignore: never commit it or paste it anywhere.
# =====================================================================

# Your Wi-Fi network.
wifi_ssid: "YOUR_WIFI_NAME"
wifi_password: "YOUR_WIFI_PASSWORD"

# 32-byte base64 key that encrypts the link to Home Assistant.
# New device: generate one at https://esphome.io/components/api/ or run
#   python -c "import secrets,base64;print(base64.b64encode(secrets.token_bytes(32)).decode())"
# Replacing an existing device: reuse its current key so Home Assistant
# stays paired (ESPHome dashboard > the device > Edit > api: encryption).
api_encryption_key: "GENERATE_A_32_BYTE_BASE64_KEY"

# Password for the fallback hotspot the board starts when it can't join
# Wi-Fi. The default works for first setup; change it if you like.
# Wi-Fi requires at least 8 characters.
fallback_ap_password: "safer-laundry"
